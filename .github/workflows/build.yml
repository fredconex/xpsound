name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on tags like v0.9.5, v1.0.0, etc.

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Create ZIP archive
        run: |
          mkdir -p release
          cp -r xpsound release/
          cd release
          zip -r ../XPSound-${{ github.ref_name }}.zip xpsound/
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: XPSound-${{ github.ref_name }}.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}